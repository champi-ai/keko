# Full bundled benchmark on the keko base model, CPU. ~310 items; expect ~20-30 min on a laptop CPU.
name: smollm_cpu
out_dir: negative_space/results/smollm_cpu
seed: 0
model:
  id: HuggingFaceTB/SmolLM-360M-Instruct
  dtype: float32
  device_map: cpu
  batch_size: 16
  max_new_tokens: 16
data:
  n_items: null
  n_keko_honest: 12
extract:
  layers: [4, 8, 16, 24, 32]
  k_samples: 5
  temperature: 0.7
noise:
  sites: [embedding, hidden]
  hidden_layer: 16
  levels: [0.0, 0.1, 0.25, 0.5, 1.0]
  n_draws: 2
analysis:
  layer: 16
  pooling: last
  n_seeds: 3
  n_boot: 1000
